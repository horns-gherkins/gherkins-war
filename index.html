<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101812">
    <title>Gherkins War</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gherkins War">
    <link rel="icon" href="assets/apple-touch-icon.png" type="image/png" sizes="180x180">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="style.css?v=57">
</head>
<body>
    <div id="start-screen" class="start-screen" role="dialog" aria-modal="true" aria-label="Main menu">
        <div class="start-logo">
            <div class="start-logo-image" aria-hidden="true"></div>
            <h1 class="start-title">Gherkins<br>War</h1>
        </div>
        <nav class="start-menu" aria-label="Main menu options">
            <button id="btn-resume" class="menu-btn menu-btn--inactive" disabled aria-disabled="true">Resume</button>
            <button id="btn-new-game" class="menu-btn">New Game</button>
            <button id="btn-settings" class="menu-btn menu-btn--inactive" disabled aria-disabled="true">Settings</button>
            <button id="btn-enter-code" class="menu-btn menu-btn--inactive" disabled aria-disabled="true">Enter Code</button>
        </nav>
    </div>

    <div id="confirm-dialog" class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-msg" hidden>
        <div class="confirm-card">
            <p id="confirm-msg" class="confirm-msg">Restart game?</p>
            <div class="confirm-buttons">
                <button id="confirm-yes" class="menu-btn confirm-btn">Yes</button>
                <button id="confirm-no" class="menu-btn confirm-btn">No</button>
            </div>
        </div>
    </div>

    <main class="game" aria-label="Gherkins War mobile game">
        <button id="menu-btn" class="ingame-menu-btn" aria-label="Main menu" hidden>&#9776;</button>
        <section class="arena" aria-label="Game field">
            <div id="field-frame" class="field-frame">
                <canvas id="field" class="field" role="img" aria-label="Game map"></canvas>
            </div>
        </section>

        <div class="controls" aria-label="Game controls">
            <div class="control-group">
                <div class="joystick" id="joystick" aria-label="Movement joystick" role="application">
                    <div class="stick-ring"></div>
                    <div class="stick-knob" id="stick-knob"></div>
                </div>
            </div>

            <div class="control-group">
                <div class="aim-pad" aria-label="Aim and fire controls">
                    <button class="aim-direction aim-up" data-direction="u" aria-label="Aim up" aria-pressed="false"></button>
                    <button class="aim-direction aim-right" data-direction="r" aria-label="Aim right" aria-pressed="false"></button>
                    <button class="aim-direction aim-down" data-direction="d" aria-label="Aim down" aria-pressed="false"></button>
                    <button class="aim-direction aim-left" data-direction="l" aria-label="Aim left" aria-pressed="false"></button>
                    <button class="fire-button" id="fire-button" aria-label="Fire"></button>
                </div>
            </div>
        </div>

        <output id="debug-status" class="debug-status" aria-live="polite"></output>

        <div id="motion-prompt" class="motion-prompt" role="dialog" aria-modal="true" aria-labelledby="motion-prompt-title" hidden>
            <div class="motion-prompt-card">
                <h1 id="motion-prompt-title">Enable motion access?</h1>
                <p>Motion access is used to show the field tilt effect. Your device may ask you to allow it.</p>
                <button id="motion-enable" type="button">Enable motion</button>
            </div>
        </div>
    </main>
    <script src="game.js?v=52"></script>
</body>
</html>
